name: STaaS UI journeys

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staas-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-visualise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate application
        run: npm run check
      - name: Run founder journey and chat-gate tests
        run: npm run test:e2e
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staas-visual-evidence-${{ github.run_number }}
          path: |
            docs/screenshots/*.png
            test-results/
          if-no-files-found: warn
          retention-days: 30
