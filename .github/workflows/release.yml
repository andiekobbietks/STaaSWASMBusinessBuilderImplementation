name: Tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Enforce explicit release approval
        env:
          RELEASE_APPROVED: ${{ vars.RELEASE_APPROVED }}
        run: |
          if [ "$RELEASE_APPROVED" != "true" ]; then
            echo "Release blocked. Complete the provenance, licence and security review, then set repository variable RELEASE_APPROVED=true."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION" || {
            echo "Tag $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          }
      - name: Validate source
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high
      - name: Guard retired demo credentials and flags
        shell: bash
        run: |
          if grep -RInE 'demo123456|DEMO_PASSWORD|demo@businessbuilder\.app|STAAS_DEMO_CHAT' src supabase; then
            echo "Retired demo credentials or chat flags must not be included in a release."
            exit 1
          fi
          if [ -d api ] && grep -RInE 'demo123456|DEMO_PASSWORD|demo@businessbuilder\.app|STAAS_DEMO_CHAT' api; then
            echo "Retired demo credentials or chat flags must not be included in a release."
            exit 1
          fi
      - name: Scan every Git ref and commit for secrets
        shell: bash
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 2 --log-opts="--all --full-history" .
      - name: Generate licence inventory
        run: npx --yes license-checker --production --json > third-party-licenses.json
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > staas-sbom.cdx.json
      - name: Create source and application bundles
        shell: bash
        run: |
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="staas-${GITHUB_REF_NAME}/" "$GITHUB_SHA" > "release-assets/staas-source-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "release-assets/staas-build-${GITHUB_REF_NAME}.tar.gz" -C dist .
          cp third-party-licenses.json release-assets/
          cp staas-sbom.cdx.json release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: release-assets/*
