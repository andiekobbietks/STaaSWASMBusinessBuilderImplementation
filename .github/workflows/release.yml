name: Tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source and full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Enforce explicit release approval
        env:
          RELEASE_APPROVED: ${{ vars.RELEASE_APPROVED }}
        run: |
          if [ "$RELEASE_APPROVED" != "true" ]; then
            echo "Release blocked. Complete docs/RELEASE-CHECKLIST.md and set repository variable RELEASE_APPROVED=true only after owner sign-off."
            exit 1
          fi
      - name: Verify annotated tag, SemVer and main ancestry
        shell: bash
        run: |
          TAG_REF="refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$TAG_REF")" != "tag" ]; then
            echo "Release tags must be annotated tags."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION" || {
            echo "Tag $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit reachable from main."
            exit 1
          }
          node -e "const v=process.env.TAG_VERSION; if (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$/.test(v)) process.exit(1)" 
        env:
          TAG_VERSION: ${{ github.ref_name }}
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high
      - name: Guard retired demo credentials and flags
        shell: bash
        run: |
          if grep -RInE 'demo123456|DEMO_PASSWORD|demo@businessbuilder\.app|STAAS_DEMO_CHAT' src supabase; then
            echo "Retired demo credentials or chat flags must not be included in a release."
            exit 1
          fi
          if [ -d api ] && grep -RInE 'demo123456|DEMO_PASSWORD|demo@businessbuilder\.app|STAAS_DEMO_CHAT' api; then
            echo "Retired demo credentials or chat flags must not be included in a release."
            exit 1
          fi
      - name: Scan repository history for secrets
        shell: bash
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 2 --log-opts="--all --full-history" .
      - name: Generate production dependency licence inventory
        run: npx --yes license-checker --production --json > third-party-licenses.json
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > staas-sbom.cdx.json
      - name: Assemble release artefacts
        shell: bash
        run: |
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="staas-$GITHUB_REF_NAME/" "$GITHUB_SHA" > "release-assets/staas-source-$GITHUB_REF_NAME.tar.gz"
          tar -czf "release-assets/staas-build-$GITHUB_REF_NAME.tar.gz" -C dist .
          cp LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md RELEASE.md third-party-licenses.json staas-sbom.cdx.json release-assets/
          node -e 'const fs=require("fs"); fs.writeFileSync("release-assets/build-provenance.json", JSON.stringify({name:"STaaS Business Builder",tag:process.env.GITHUB_REF_NAME,commit:process.env.GITHUB_SHA,workflow:process.env.GITHUB_WORKFLOW,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,repository:process.env.GITHUB_REPOSITORY},null,2)+"\\n")'
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: release-assets/*
