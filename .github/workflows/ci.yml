name: CI

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh and audit compatible lockfile updates
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          if ! git diff --quiet -- package-lock.json; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package-lock.json
              git commit -m "chore(deps): refresh audited npm lockfile"
              git push
            fi
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate third-party licence inventory
        run: npx --yes license-checker --production --json > third-party-licenses.json
      - name: Upload licence inventory
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses-${{ github.sha }}
          path: third-party-licenses.json
          if-no-files-found: error
          retention-days: 90
