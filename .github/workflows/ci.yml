name: CI

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Guard retired demo credentials and flags
        shell: bash
        run: |
          if grep -RInE 'demo123456|DEMO_PASSWORD|demo@businessbuilder\.app|STAAS_DEMO_CHAT' src supabase; then
            echo "Retired demo credentials or chat flags must not return to current source."
            exit 1
          fi
          if [ -d api ] && grep -RInE 'demo123456|DEMO_PASSWORD|demo@businessbuilder\.app|STAAS_DEMO_CHAT' api; then
            echo "Retired demo credentials or chat flags must not return to current source."
            exit 1
          fi
      - name: Scan every Git ref and commit for secrets
        shell: bash
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 2 --log-opts="--all --full-history" .
      - name: Generate third-party licence inventory
        run: npx --yes license-checker --production --json > third-party-licenses.json
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > staas-sbom.cdx.json
      - name: Create non-publishing release bundle preview
        shell: bash
        run: |
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="staas-${GITHUB_SHA}/" "${GITHUB_SHA}" > "release-assets/staas-source-${GITHUB_SHA}.tar.gz"
          tar -czf "release-assets/staas-build-${GITHUB_SHA}.tar.gz" -C dist .
          cp third-party-licenses.json release-assets/
          cp staas-sbom.cdx.json release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Upload supply-chain and release-preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-release-preview-${{ github.sha }}
          path: |
            third-party-licenses.json
            staas-sbom.cdx.json
            release-assets/*
          if-no-files-found: error
          retention-days: 90
