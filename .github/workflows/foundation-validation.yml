name: STaaS Foundation validation

on:
  push:
    paths:
      - "foundation/**"
      - ".github/workflows/foundation-validation.yml"
  pull_request:
    paths:
      - "foundation/**"
      - ".github/workflows/foundation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foundation/requirements-dev.txt

      - name: Install pinned development dependencies
        run: python -m pip install -r foundation/requirements-dev.txt

      - name: Validate STaaS profile
        run: python foundation/tools/validate_profile.py foundation/examples/founder-pilot

      - name: Run Foundation tests
        run: python -m unittest discover -s foundation/tests -v
